name: terraform-core-data-apply

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: core-data-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/deuna-${{ inputs.environment }}-github-terraform-deployer
          aws-region: us-east-1

      - uses: actions/download-artifact@v4
        with:
          name: core-data-${{ inputs.environment }}-tfplan
          path: stacks/core-data

      - name: terraform init
        run: terraform -chdir=stacks/core-data init -backend-config=../../environments/${{ inputs.environment }}/backend.hcl

      - name: terraform apply
        run: terraform -chdir=stacks/core-data apply core-data-${{ inputs.environment }}.tfplan
